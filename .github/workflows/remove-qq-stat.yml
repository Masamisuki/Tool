name: 分流规则清理
on:
  schedule:
    # 北京时间 0:15 (UTC+8) → UTC 16:15
    - cron: '15 16 * * *'
  workflow_dispatch:   # 允许手动运行

jobs:
  remove-entries:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 允许推送修改

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove specific lines from target files
        run: |
          echo "::group::Processing domainset_reject.conf"
          if [ -f Rules/domainset_reject.conf ]; then
            sed -i '/^\.stat\.y\.qq\.com$/d' Rules/domainset_reject.conf
            echo "Removed .stat.y.qq.com from domainset_reject.conf"
          else
            echo "File Rules/domainset_reject.conf not found, skipping."
          fi
          echo "::endgroup::"

          echo "::group::Processing Ads_Block.list"
          if [ -f Rules/Ads_Block.list ]; then
            sed -i '/^DOMAIN-SUFFIX,stat\.y\.qq\.com$/d' Rules/Ads_Block.list
            sed -i '/^DOMAIN,stat\.y\.qq\.com$/d' Rules/Ads_Block.list
            sed -i '/^DOMAIN-SUFFIX,stat6\.y\.qq\.com$/d' Rules/Ads_Block.list
            sed -i '/^DOMAIN,stat6\.y\.qq\.com$/d' Rules/Ads_Block.list
            echo "Removed stat.y.qq.com & stat6.y.qq.com from Ads_Block.list"
          else
            echo "File Rules/Ads_Block.list not found, skipping."
          fi
          echo "::endgroup::"

          echo "::group::Processing Ads_SukkaW.list"
          if [ -f Rules/Ads_SukkaW.list ]; then
            sed -i '/^DOMAIN-SUFFIX,stat\.y\.qq\.com$/d' Rules/Ads_SukkaW.list
            echo "Removed DOMAIN-SUFFIX,stat.y.qq.com from Ads_SukkaW.list"
          else
            echo "File Rules/Ads_SukkaW.list not found, skipping."
          fi
          echo "::endgroup::"

          echo "::group::Processing 广告平台拦截器.sgmodule"
          if [ -f "iKeLee/广告平台拦截器.sgmodule" ]; then
            sed -i '/^DOMAIN,stat\.y\.qq\.com,REJECT$/d' "iKeLee/广告平台拦截器.sgmodule"
            sed -i '/^DOMAIN,stat6\.y\.qq\.com,REJECT$/d' "iKeLee/广告平台拦截器.sgmodule"
            echo "Removed stat.y.qq.com & stat6.y.qq.com from 广告平台拦截器.sgmodule"
          else
            echo "File iKeLee/广告平台拦截器.sgmodule not found, skipping."
          fi
          echo "::endgroup::"

      - name: Commit and push if changes exist
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "🧹 Remove stat.y.qq.com / stat6.y.qq.com entries ($(date -u +'%Y-%m-%d'))"
            git push origin main
          else
            echo "No changes to commit."
          fi
