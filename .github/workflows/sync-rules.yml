name: 分流规则同步

on:
  schedule:
    # 北京时间每天 0:00 (UTC+8) → UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许推送代码
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync rules from Repcz/Tool (branch X)
        env:
          REPCZ_RULES_URL: "https://api.github.com/repos/Repcz/Tool/contents/Surge/Rules?ref=X"
        run: |
          echo "::group::Downloading Repcz rules"
          # 获取文件列表 (flat directory, no subdirs)
          files=$(curl -sS "$REPCZ_RULES_URL" | jq -r '.[] | select(.type=="file") | .name + " " + .download_url')
          while IFS=' ' read -r name url; do
            # 跳过 Emby.list，保留仓库自己的版本
            if [ "$name" = "Emby.list" ]; then
              echo "Skipping Emby.list to keep local version"
              continue
            fi
            echo "Downloading $name"
            curl -sS -o "Rules/$name" "$url"
          done <<< "$files"
          echo "::endgroup::"

      - name: Download DNS mapping rules and rename
        run: |
          echo "::group::Downloading DNS mapping rules"
          declare -A dns_map=(
            ["Alibaba.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/alibaba.conf"
            ["Tencent.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/tencent.conf"
            ["Bilibili.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/bilibili.conf"
            ["ByteDance.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/bytedance.conf"
            ["Baidu.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/baidu.conf"
          )
          for newname in "${!dns_map[@]}"; do
            url="${dns_map[$newname]}"
            echo "Downloading $newname from $url"
            curl -sS -o "Rules/$newname" "$url"
          done
          echo "::endgroup::"

      - name: Download reject rules and rename
        run: |
          echo "::group::Downloading reject rules"
          curl -sS -o "Rules/domainset_reject.conf" "https://ruleset.skk.moe/List/domainset/reject.conf"
          curl -sS -o "Rules/non_ip_reject.conf" "https://ruleset.skk.moe/List/non_ip/reject.conf"
          echo "::endgroup::"

      - name: Download Ads_Block.list
        run: |
          echo "::group::Downloading Ads_Block.list"
          curl -sS -o "Rules/Ads_Block.list" "https://raw.githubusercontent.com/thNylHx/Tools/refs/heads/main/Ruleset/Surge/Block/Ads_Block.list"
          echo "::endgroup::"

      - name: Commit and push if changes exist
        run: |
          if [[ -n $(git status -s) ]]; then
            git add Rules/
            git commit -m "🔄 Daily rules sync ($(date -u +'%Y-%m-%d'))"
            git push origin main
          else
            echo "No changes detected, skipping commit."
          fi
