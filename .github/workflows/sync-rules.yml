name: 自动更新与规则清理

on:
  schedule:
    # 北京时间每天 23:30 (UTC 15:30) 统一触发
    - cron: '30 15 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许推送代码
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup git and workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Rules

      - name: Sync rules from Repcz/Tool (branch X)
        env:
          REPCZ_RULES_URL: "https://api.github.com/repos/Repcz/Tool/contents/Surge/Rules?ref=X"
        run: |
          echo "::group::Downloading Repcz rules"
          files=$(curl -sS "$REPCZ_RULES_URL" | jq -r '.[] | select(.type=="file") | .name + " " + .download_url')
          
          while IFS=' ' read -r name url || [ -n "$name" ]; do
            [ -z "$name" ] && continue
            
            # 【核心保留点】如果是 Emby.list，直接跳过，绝不下载和覆盖
            if [ "$name" = "Emby.list" ]; then
              echo "➔ Skipping Emby.list (Keep local version untouched)"
              continue
            fi
            
            echo "Downloading $name"
            curl -sS -o "Rules/$name" "$url"
          done <<< "$files"
          echo "::endgroup::"

      - name: Download DNS mapping rules and rename
        run: |
          echo "::group::Downloading DNS mapping rules"
          declare -A dns_map=(
            ["Alibaba.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/alibaba.conf"
            ["Tencent.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/tencent.conf"
            ["Bilibili.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/bilibili.conf"
            ["ByteDance.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/bytedance.conf"
            ["Baidu.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/baidu.conf"
          )
          for newname in "${!dns_map[@]}"; do
            url="${dns_map[$newname]}"
            echo "Downloading $newname from $url"
            curl -sS -o "Rules/$newname" "$url"
          done
          echo "::endgroup::"

      - name: Download reject rules and rename
        run: |
          echo "::group::Downloading reject rules"
          curl -sS -o "Rules/domainset_reject.conf" "https://ruleset.
