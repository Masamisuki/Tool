name: 自动更新与规则清理

on:
  schedule:
    # 北京时间每天 0:00 (UTC 16:00) 统一触发
    - cron: '0 16 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许推送代码
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup git and workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Rules

      - name: Sync rules from Repcz/Tool (branch X)
        env:
          REPCZ_RULES_URL: "https://api.github.com/repos/Repcz/Tool/contents/Surge/Rules?ref=X"
        run: |
          echo "::group::Downloading Repcz rules"
          files=$(curl -sS "$REPCZ_RULES_URL" | jq -r '.[] | select(.type=="file") | .name + " " + .download_url')
          
          while IFS=' ' read -r name url || [ -n "$name" ]; do
            [ -z "$name" ] && continue
            
            # 【核心保留点】如果是 Emby.list，直接跳过，绝不下载和覆盖
            if [ "$name" = "Emby.list" ]; then
              echo "➔ Skipping Emby.list (Keep local version untouched)"
              continue
            fi
            
            echo "Downloading $name"
            curl -sS -o "Rules/$name" "$url"
          done <<< "$files"
          echo "::endgroup::"

      - name: Download DNS mapping rules and rename
        run: |
          echo "::group::Downloading DNS mapping rules"
          declare -A dns_map=(
            ["Alibaba.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/alibaba.conf"
            ["Tencent.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/tencent.conf"
            ["Bilibili.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/bilibili.conf"
            ["ByteDance.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/bytedance.conf"
            ["Baidu.conf"]="https://ruleset.skk.moe/Modules/Rules/sukka_local_dns_mapping/baidu.conf"
          )
          for newname in "${!dns_map[@]}"; do
            url="${dns_map[$newname]}"
            echo "Downloading $newname from $url"
            curl -sS -o "Rules/$newname" "$url"
          done
          echo "::endgroup::"

      - name: Download reject rules and rename
        run: |
          echo "::group::Downloading reject rules"
          curl -sS -o "Rules/domainset_reject.conf" "https://ruleset.skk.moe/List/domainset/reject.conf"
          curl -sS -o "Rules/non_ip_reject.conf" "https://ruleset.skk.moe/List/non_ip/reject.conf"
          echo "::endgroup::"

      - name: Download Ads_Block.list
        run: |
          echo "::group::Downloading Ads_Block.list"
          curl -sS -o "Rules/Ads_Block.list" "https://raw.githubusercontent.com/thNylHx/Tools/refs/heads/main/Ruleset/Surge/Block/Ads_Block.list"
          echo "::endgroup::"

      - name: Remove specific lines from target files (Clean QQ Stat)
        run: |
          echo "::group::Processing domainset_reject.conf"
          if [ -f Rules/domainset_reject.conf ]; then
            sed -i '/^\.stat\.y\.qq\.com$/d' Rules/domainset_reject.conf
            echo "Removed .stat.y.qq.com"
          fi
          echo "::endgroup::"

          echo "::group::Processing Ads_Block.list"
          if [ -f Rules/Ads_Block.list ]; then
            sed -i '/^DOMAIN-SUFFIX,stat\.y\.qq\.com$/d' Rules/Ads_Block.list
            sed -i '/^DOMAIN,stat\.y\.qq\.com$/d' Rules/Ads_Block.list
            sed -i '/^DOMAIN-SUFFIX,stat6\.y\.qq\.com$/d' Rules/Ads_Block.list
            sed -i '/^DOMAIN,stat6\.y\.qq\.com$/d' Rules/Ads_Block.list
            echo "Removed stat.y.qq.com & stat6.y.qq.com"
          fi
          echo "::endgroup::"

          echo "::group::Processing Ads_SukkaW.list"
          if [ -f Rules/Ads_SukkaW.list ]; then
            sed -i '/^DOMAIN-SUFFIX,stat\.y\.qq\.com$/d' Rules/Ads_SukkaW.list
          fi
          echo "::endgroup::"

          echo "::group::Processing 广告平台拦截器.sgmodule"
          if [ -f "iKeLee/广告平台拦截器.sgmodule" ]; then
            sed -i '/^DOMAIN,stat\.y\.qq\.com,REJECT$/d' "iKeLee/广告平台拦截器.sgmodule"
            sed -i '/^DOMAIN,stat6\.y\.qq\.com,REJECT$/d' "iKeLee/广告平台拦截器.sgmodule"
          fi
          echo "::endgroup::"

      - name: Commit and push if changes exist
        run: |
          git pull origin main --rebase
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "🔄 自动同步并清理规则 ($(date -u +'%Y-%m-%d'))"
            git push origin main
          else
            echo "No changes detected, skipping commit."
          fi


